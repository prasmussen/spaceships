# Linux host networking keeps relay ports mapped one-to-one.
services:
  turn:
    image: coturn/coturn@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - -c
      - /dev/null
      - --log-file=stdout
      - --pidfile=/tmp/turnserver.pid
      - --no-cli
      - --no-tls
      - --no-multicast-peers
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Set TURN_SECRET}
      - --realm=${TURN_HOST:?Set TURN_HOST}
      - --listening-ip=${TURN_PRIVATE_IP:?Set TURN_PRIVATE_IP}
      - --relay-ip=${TURN_PRIVATE_IP}
      - --external-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP}/${TURN_PRIVATE_IP}
      - --min-port=45000
      - --max-port=45199
      - --user-quota=16
      - --total-quota=1000
      - --max-bps=262144
      - --bps-capacity=26214400
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
